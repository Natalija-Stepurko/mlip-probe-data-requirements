name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install -e ".[test]"
      - name: Tests (includes rebuilding the committed results and the page)
        run: python -m pytest
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Page runs without errors
        run: |
          npm install --no-save jsdom@29.1.1
          node scripts/check_page.js docs/index.html
