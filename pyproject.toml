[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlip-probe-data-requirements"
version = "1.0.0"
description = "How many labelled materials a probe on a frozen interatomic-potential embedding needs"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Natalija Stepurko" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "xgboost>=2.1",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
mlip-probe = "mlip_probe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mlip_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
